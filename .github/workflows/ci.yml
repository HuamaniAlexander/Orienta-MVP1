name: Verificar ORIENTA
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: orienta
          POSTGRES_PASSWORD: orienta
          POSTGRES_DB: orienta_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orienta"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://orienta:orienta@localhost:5432/orienta_test
      DATABASE_URL: postgresql+psycopg://orienta:orienta@localhost:5432/orienta_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          python-version: "3.12"
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check backend ml packages scripts
      - run: uv run ruff format --check backend ml packages scripts
      - run: uv run pytest -q
      - run: PYTHONPATH=backend uv run alembic -c backend/alembic.ini upgrade head
      - run: PYTHONPATH=backend uv run python -m app.adapters.inbound.cli.import_catalog data/catalogo_legacy.json
      - run: PYTHONPATH=backend uv run python -m app.adapters.inbound.cli.import_directory
      - run: PYTHONPATH=backend uv run python -m app.adapters.inbound.cli.review_offers data/revisiones_ofertas.json
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: |
          PYTHONPATH=backend .venv/bin/uvicorn scripts.demo:make_app --factory --host 127.0.0.1 --port 8000 &
          orienta_server_pid=$!
          trap 'kill "$orienta_server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/v1/health/live && break; sleep 1; done
          npm --prefix frontend run test:e2e
