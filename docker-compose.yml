services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: orienta
      POSTGRES_PASSWORD: orienta
      POSTGRES_DB: orienta
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["orienta_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orienta"]
      interval: 5s
      retries: 10
volumes:
  orienta_pg:
