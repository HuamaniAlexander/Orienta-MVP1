[project]
name = "orienta-mvp1"
version = "0.1.0"
description = "ORIENTA: comparación académica con orientación explicable"
requires-python = ">=3.12"
dependencies = [
 "fastapi>=0.115,<1",
 "uvicorn>=0.34,<1",
 "sqlalchemy>=2.0,<3",
 "psycopg[binary]>=3.2,<4",
 "alembic>=1.14,<2",
 "pydantic-settings>=2.7,<3",
 "argon2-cffi>=23.1,<26",
 "httpx[socks]>=0.28,<1",
 "openpyxl>=3.1,<4",
 "orienta-features",
]
[project.optional-dependencies]
ml = ["scikit-learn>=1.6,<2", "pandas>=2.2,<4", "joblib>=1.4,<2"]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[tool.uv.sources]
orienta-features = { path = "packages/orienta_features", editable = true }
[tool.pytest.ini_options]
pythonpath = ["backend", "packages/orienta_features", "."]
testpaths = ["backend/tests", "ml/tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
